<body>
    <h1 id="top" class="">Class : 08 -- Forms & Extra Markup --</h1>

    <p>Gender:</p>
    <label for="male">
        <input type="radio" name="gender" value="m" checked id="male" /> Male
    </label>
    <label for="f">
        <input type="radio" name="gender" value="f" id="f" /> Female
    </label>
    <label for="other">
        <input type="radio" name="gender" value="o" id="other" /> Others
    </label>

    <p>Select Cities:</p>
    <input type="checkbox" name="city" value="khi" /> Karachi
    <input type="checkbox" name="city" value="lhr" checked /> Lahore
    <input type="checkbox" name="city" value="pi" /> Pindi

    <p>Select Your Country:</p>
    <select name="">
        <option value="pk">Pakistan</option>
        <option value="ch">China</option>
        <option value="ir">Iran</option>
        <option value="jp">Japan</option>
    </select>

    <br>

    <br>
    <br>
    <br>

    <input type="button" value="Login">
    <button>Submit</button>


    <label>
        Username:
        <input type="text" name="username" required>
    </label>

    <input type="date">
    <input type="color">
    <input type="number">

    <hr>
    <input type="text">
    <input type="search">

    <div>
        <h1>Today is Sunday</h1>
        <h2>Yesterday is Saturday</h2>
        <h3>Tomorrow is Monday</h3>
    </div>
